<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安聯人壽智能客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 標題區 - 可完全自訂文字 */
        .chat-header {
            background: #003d79;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 22px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.85;
            font-weight: 300;
        }

        /* 對話區 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f0f4f8;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }

        .message-bubble {
            max-width: 78%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.7;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #003d79;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .message.bot .message-bubble ul {
            margin-left: 20px;
            margin-top: 8px;
        }

        .message.bot .message-bubble li {
            margin-bottom: 4px;
        }

        /* 輸入區 */
        .chat-input {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 28px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .chat-input input:focus {
            border-color: #003d79;
            box-shadow: 0 0 0 3px rgba(0,61,121,0.1);
        }

        .chat-input input::placeholder {
            color: #9ca3af;
            font-size: 14px;
        }

        .chat-input button {
            padding: 14px 28px;
            background: #003d79;
            color: white;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            font-family: inherit;
        }

        .chat-input button:hover {
            background: #002d5a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,61,121,0.25);
        }

        .chat-input button:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 載入中動畫 */
        .typing-indicator {
            display: none;
            padding: 14px 18px;
            background: white;
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .typing-indicator.active { display: block; }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            margin: 0 3px;
            animation: typing 1.4s infinite both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* 免責聲明 */
        .disclaimer {
            padding: 10px 20px;
            background: #fef3c7;
            border-top: 1px solid #fde68a;
            font-size: 12px;
            color: #92400e;
            text-align: center;
            line-height: 1.5;
        }

        /* 滾動條美化 */
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .chat-messages::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- ========== 標題區：可自由修改文字 ========== -->
    <div class="chat-header">
        <h1>🏢 安聯人壽智能客服</h1>
        <p>專業保險諮詢 · 為您解答各項商品疑問</p>
    </div>

    <!-- 對話區 -->
    <div class="chat-messages" id="chatMessages">
        <!-- ========== 歡迎訊息：可自由修改 ========== -->
        <div class="message bot">
            <div class="message-bubble">
                您好！我是安聯人壽智能客服 👋<br><br>
                我可以協助您查詢「吉利發發」等壽險商品的相關資訊，包括：
                <ul>
                    <li>死亡給付計算公式</li>
                    <li>解約費用率查詢</li>
                    <li>保單條款說明</li>
                </ul>
                請問有什麼可以幫您的嗎？
            </div>
        </div>
    </div>

    <!-- ========== 免責聲明：可自由修改 ========== -->
    <div class="disclaimer">
        ※ 其他未盡事宜，請參閱安聯人壽現行投保規則或保單條款。
    </div>

    <!-- 輸入區 -->
    <div class="chat-input">
        <input 
            type="text" 
            id="userInput" 
            placeholder="請輸入您的問題，例如：吉利發發壽險甲型的公式" 
            onkeypress="if(event.key==='Enter') sendMessage()"
        >
        <button id="sendBtn" onclick="sendMessage()">送出</button>
    </div>
</div>

<script>
    // ==================== 設定區 ====================
    // ⚠️ 請務必使用 Production URL（去掉 -test）
    const WEBHOOK_URL = 'https://dimmed-riddance-footnote.ngrok-free.dev/webhook/custom-chat';
    // ================================================

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // 產生唯一 session ID（讓 AI 記得對話上下文）
    const sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user' : 'bot'}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        
        if (!isUser) {
            // 簡易格式化：換行、粗體
            let formatted = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
            bubble.innerHTML = formatted;
        } else {
            bubble.textContent = text;
        }
        
        div.appendChild(bubble);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typingIndicator';
        
        const bubble = document.createElement('div');
        bubble.className = 'typing-indicator active';
        bubble.innerHTML = '<span></span><span></span><span></span>';
        
        div.appendChild(bubble);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // 顯示使用者訊息
        addMessage(message, true);
        userInput.value = '';
        sendBtn.disabled = true;
        
        // 顯示載入中
        showTyping();

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    sessionId: sessionId
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            hideTyping();
            
            // 解析 AI Agent 回傳格式
            // n8n AI Agent 通常回傳 { "output": "回覆內容" }
            let reply = '';
            if (typeof data === 'string') {
                reply = data;
            } else if (data.output) {
                reply = data.output;
            } else if (data.message) {
                reply = data.message;
            } else if (Array.isArray(data) && data[0]?.output) {
                reply = data[0].output;
            } else {
                reply = JSON.stringify(data);
            }
            
            addMessage(reply, false);

        } catch (error) {
            hideTyping();
            addMessage('抱歉，系統暫時無法回應，請稍後再試。（錯誤：' + error.message + '）', false);
            console.error('Error:', error);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // 頁面載入時聚焦
    window.onload = () => userInput.focus();
</script>

</body>
</html>
